name: API Compatibility (Abstractions)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/api-compatibility.yml'
      - 'src/HoneyDrunk.Memory.Abstractions/**'
      - 'api/**'
      - 'tests/HoneyDrunk.Memory.Abstractions.Tests/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  abstractions-shape:
    name: Abstractions Shape
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-api-compatibility.yml@de51d34c6f2f6db2346275b6582c8863521a68ed
    with:
      actions-ref: 'de51d34c6f2f6db2346275b6582c8863521a68ed'
      dotnet-version: '11.0.100'
      project-path: src/HoneyDrunk.Memory.Abstractions/HoneyDrunk.Memory.Abstractions.csproj

  contract-shape:
    name: Contract Shape Canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 11.0.100
      - name: Check the frozen contract shape
        run: dotnet test tests/HoneyDrunk.Memory.Abstractions.Tests -c Release --filter Category=ContractShape
